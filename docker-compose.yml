services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: integra
      POSTGRES_PASSWORD: integra
      POSTGRES_DB: integra
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integra -d integra"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://integra:integra@db:5432/integra
      APP_ENV: docker
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "app.workers"]
    environment:
      DATABASE_URL: postgresql+asyncpg://integra:integra@db:5432/integra
      APP_ENV: docker
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
