        contains_injection_or_override_attempt: false
        rationale_short: "Typed load proposal accepted."
        tool_calls:
          - {name: create_case, arguments: []}
        confidence: 0.95
      - intake_type: load_request
        fields: []
        missing_required_fields: []
        priority: normal
        contains_injection_or_override_attempt: false
        rationale_short: "Load request processing completed."
        tool_calls: []
