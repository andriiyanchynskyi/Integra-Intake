profile_version: 2
slug: repair-service
scenario_key: repair_service
display_name: Repair service
intake_types:
  - name: service_request
    description: A request to diagnose or repair an asset.
    required_fields: [customer_name, contact, issue, asset_type]
  - name: warranty_claim
    description: A request to assess a warranty claim.
    required_fields: [customer_name, contact, issue, serial_number]
fields:
  customer_name: {type: short_text, label: Customer name}
  contact: {type: email, label: Customer email}
  issue: {type: long_text, label: Issue description}
  asset_type:
    type: single_select
    label: Asset type
    options: [appliance, vehicle, equipment]
  preferred_time: {type: date_time, label: Preferred appointment}
  serial_number: {type: short_text, label: Serial number}
action_policy:
  create_case: {allowed: true, requires_approval: false, execution: executable}
  find_customer: {allowed: true, requires_approval: false, execution: executable}
  update_case_fields: {allowed: true, requires_approval: false, execution: executable}
  create_reply_draft: {allowed: true, requires_approval: false, execution: executable}
  send_reply: {allowed: true, requires_approval: true, execution: policy_only}
  close_case: {allowed: true, requires_approval: true, execution: policy_only}
  flag_for_review: {allowed: true, requires_approval: false, execution: executable}
documents: {}
routing:
  outcome_names: [urgent, awaiting_input, pending_approval, ready, rejected]
  always_approval_actions: [send_reply, close_case]
